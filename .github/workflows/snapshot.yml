name: Snapshot

# snapshot/0.1.0-dev3 -> Snapshot (pre-release)
# Notes come from the "# <version>" section of Releases.md.

on:
  push:
    tags:
      - 'snapshot/*'

permissions:
  contents: write

jobs:
  langs:
    uses: ./.github/workflows/langs.yml

  build-zips:
    name: Build per-locale ZIPs (${{ matrix.lang }})
    needs: langs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.langs.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set build variables (from tag)
        shell: bash
        run: echo "GIT_VER=${GITHUB_REF_NAME#snapshot/}" >> "$GITHUB_ENV"

      - name: Create release notes for package manifest
        run: |
          python3 .github/scripts/extract-release-notes.py "${{ env.GIT_VER }}" Releases.md > Notes.md
          sed -n '1,120p' Notes.md

      - uses: ./.github/actions/build-zips
        with:
          version: ${{ env.GIT_VER }}
          lang: ${{ matrix.lang }}
          notes-file: Notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: ethos-gauges-${{ env.GIT_VER }}-${{ matrix.lang }}
          path: dist/*.zip
          if-no-files-found: error

  create-snapshot:
    name: Create Snapshot Release
    needs: [build-zips]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set build variables (from tag)
        shell: bash
        run: echo "GIT_VER=${GITHUB_REF_NAME#snapshot/}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la ./dist

      - name: Create snapshot notes
        run: python3 .github/scripts/extract-release-notes.py "${{ env.GIT_VER }}" Releases.md > Notes.md

      - name: Create Snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip --prerelease \
            --notes-file Notes.md --title "Ethos Gauges - Snapshot ${{ env.GIT_VER }}"
